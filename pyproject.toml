[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "upwatch"
dynamic = ["version"]
description = "A tiny, self-hosted uptime monitor for a handful of URLs: CLI + local dashboard, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["uptime", "monitoring", "status", "healthcheck", "cli", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jayspyroyale/upwatch"
Issues = "https://github.com/jayspyroyale/upwatch/issues"

[project.scripts]
upwatch = "upwatch.cli:main"

[tool.setuptools]
packages = ["upwatch"]

[tool.setuptools.dynamic]
version = { attr = "upwatch.__version__" }

[tool.setuptools.package-data]
upwatch = ["static/*.html"]
