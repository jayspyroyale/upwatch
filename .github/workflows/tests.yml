name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test
        run: |
          upwatch --version
          upwatch --db smoke.db add https://example.com --name Example
          upwatch --db smoke.db list
